name: actividad

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actividad
  cancel-in-progress: false

jobs:
  svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || (git commit -m "chore: actividad del día" && git push)

  juegos:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#1a1a1a,#3d3d3d,#737373,#a3a3a3,#ffffff
            dist/snake-light.svg?color_snake=#111111&color_dots=#ebebeb,#c2c2c2,#8c8c8c,#4d4d4d,#111111
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
      - name: pac-man en blanco y negro
        shell: python
        run: |
          import glob, re
          def gris(m):
              h = m.group(1)
              if len(h) == 3:
                  h = "".join(ch * 2 for ch in h)
              r, g, b = (int(h[i:i + 2], 16) for i in (0, 2, 4))
              y = round(0.299 * r + 0.587 * g + 0.114 * b)
              return "#%02x%02x%02x" % (y, y, y)
          for f in glob.glob("dist/pacman-*.svg"):
              s = open(f, encoding="utf-8").read()
              s = re.sub(r"#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b", gris, s)
              s = re.sub(r"(<svg\b[^>]*>)", r'\1<defs><filter id="bn"><feColorMatrix type="saturate" values="0"/>'
                         r'</filter></defs><g filter="url(#bn)">', s, count=1)
              head, _, tail = s.rpartition("</svg>")
              open(f, "w", encoding="utf-8").write(head + "</g></svg>" + tail)
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
